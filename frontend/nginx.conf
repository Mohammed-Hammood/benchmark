# ── HTTP Server: Redirect to HTTPS ───────────────────────────────────────────
server {
    listen 80;
    server_name benchmark.worldoftechnology.net;

    # Let's Encrypt validation path (optional but good practice)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS Server ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name benchmark.worldoftechnology.net;

    # SSL Certificate Paths (Mounted from Host)
    ssl_certificate /etc/letsencrypt/live/benchmark.worldoftechnology.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benchmark.worldoftechnology.net/privkey.pem;

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy to Django ───────────────────────────────────────────────────────
    location /django/ {
        proxy_pass http://django:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Proxy to FastAPI ──────────────────────────────────────────────────────
    location /fastapi/ {
        proxy_pass http://fastapi:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── SPA routing ───────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache static assets ───────────────────────────────────────────────────
    location ~* \.(js|css|png|svg|ico|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}